<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Streamdown parse-cache profile</title>
        <style>
            body {
                margin: 0;
                background: #fff;
                color: #111;
                font: 14px/1.5 system-ui, sans-serif;
            }
            header {
                position: sticky;
                top: 0;
                z-index: 1;
                padding: 12px 16px;
                border-bottom: 1px solid #ddd;
                background: #fff;
            }
            button {
                padding: 6px 10px;
            }
            pre {
                max-height: 180px;
                overflow: auto;
                white-space: pre-wrap;
            }
            #profile-root {
                padding: 16px;
            }
            .profile-instance {
                margin-bottom: 24px;
            }
        </style>
    </head>
    <body>
        <header>
            <button id="smoke" type="button">Run smoke profile</button>
            <pre id="result">Ready</pre>
        </header>
        <main id="profile-root"></main>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
