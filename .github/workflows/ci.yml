name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Verify declaration entries
        run: test -f dist/index.d.ts && test -f dist/core.d.ts

      - name: Test
        run: bun run test:run

      - name: Package consumer smoke test
        run: bun run test:package

      - name: Commit refreshed lockfile
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: regenerate bun lockfile"
          git push origin HEAD:${{ github.head_ref }}
